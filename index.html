
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Can Quiroga | Canto, Piano y Teoría</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #290522;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* PORTADA */

    .portada {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .portada img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* BOTONES DE LA PORTADA */

    .boton {
      position: absolute;
      top: 79.1%;
      height: 5.4%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #a51d88;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: clamp(10px, 1.5vw, 24px);
      line-height: 1;
      white-space: nowrap;
      transition: background 0.3s, transform 0.3s;
    }

    .boton:hover {
      background: #cf32ad;
      transform: translateY(-3px);
    }

    .boton-clases {
      left: 11.9%;
      width: 13.4%;
    }

    .boton-contacto {
      left: 28.5%;
      width: 11.2%;
    }

    /* WHATSAPP */

.whatsapp {
  position: fixed;
  bottom: 22px;
  right: 25px;
  width: 75px;
  height: 75px;
  display: block;
  z-index: 100;
  transition: transform 0.3s;
}

.whatsapp img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.whatsapp:hover {
  transform: scale(1.1);
}


    /* SECCIONES */

    section {
      padding: 100px 8%;
      text-align: center;
      scroll-margin-top: 20px;
    }

    section h2 {
      font-size: 38px;
      margin-bottom: 25px;
    }

    section p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 750px;
      margin: auto;
    }

    #clases {
      background: #390a36;
    }

    #contacto {
      background: #21051f;
    }

    footer {
      padding: 30px;
      text-align: center;
      color: #d99acb;
      background: #170316;
    }

    /* ADAPTACIÓN A CELULARES */

    @media (max-width: 600px) {
      .boton {
        border-radius: 5px;
        font-size: clamp(7px, 1.5vw, 11px);
      }

      .whatsapp {
        width: 50px;
        height: 50px;
        right: 12px;
        bottom: 12px;
        font-size: 27px;
      }

      section {
        padding: 65px 7%;
      }

      section h2 {
        font-size: 29px;
      }

      section p {
        font-size: 16px;
      }
    }

/* SECCION MIS CLASES */

.seccion-clases {
    position: relative;
    width: 100%;
    aspect-ratio: 1650 / 900;
    min-height: 650px;
    background-image: url("misclases-fondo.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* TARJETAS */

.tarjetas-clases {
    position: absolute;
    top: 16%;
    left: 10%;
    width: 80%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3%;
}

.tarjeta-clase {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 18px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.tarjeta-clase img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.tarjeta-clase:hover {
    transform: translateY(-10px) scale(1.04);
    box-shadow: 0 10px 25px rgba(235, 120, 200, 0.35);
}

.tarjeta-clase:active {
    transform: scale(0.96);
}

/* BOTON QUIERO EMPEZAR */

.boton-empezar {
    position: absolute;
    right: 8%;
    bottom: 5%;
    background: #ad218c;
    color: white;
    padding: 13px 30px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.boton-empezar:hover {
    background: #cf36a9;
    transform: scale(1.07);
}

.boton-empezar:active {
    transform: scale(0.95);
}

/* ADAPTACION A CELULARES */

@media (max-width: 700px) {

    .seccion-clases {
        aspect-ratio: auto;
        min-height: 950px;
        background-size: auto 100%;
    }

    .tarjetas-clases {
        top: 13%;
        left: 10%;
        width: 80%;
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .tarjeta-clase {
        max-width: 220px;
        margin: auto;
    }

    .boton-empezar {
        right: 50%;
        bottom: 4%;
        transform: translateX(50%);
        white-space: nowrap;
    }

    .boton-empezar:hover {
        transform: translateX(50%) scale(1.05);
    }

}
  </style>
</head>

<body>

  <main>

    <!-- PORTADA -->

    <div class="portada">

      <img src="portada-can.png"
           alt="Can Quiroga - Canto, Piano y Teoría Musical">

      <a href="#clases"
         class="boton boton-clases">
        Empezar Clases
      </a>

      <a href="#contacto"
         class="boton boton-contacto">
        Contactar
      </a>

    </div>

    <!-- CLASES -->

<!-- SECCION MIS CLASES -->

<section class="seccion-clases">

    <h2>Mis Clases</h2>

    <div class="tarjetas-clases">

        <a href="#contacto" class="tarjeta-clase">
            <img src="piano-tarjeta.png" alt="Clases de Piano">
        </a>

        <a href="#contacto" class="tarjeta-clase">
            <img src="canto-tarjeta.png" alt="Clases de Canto">
        </a>

        <a href="#contacto" class="tarjeta-clase">
            <img src="teoria-tarjeta.png" alt="Clases de Teoría Musical">
        </a>

    </div>

</section>

    <!-- CONTACTO -->

    <section id="contacto">
      <h2>¡Hablemos!</h2>

      <p>
        ¿Te gustaría comenzar clases o tenés alguna consulta?
        Estoy acá para ayudarte.
      </p>
    </section>

  </main>

  <!-- WHATSAPP -->

<a class="whatsapp"
   href="https://wa.me/5491165730810?text=Hola%20Can%20Quiroga!%20Quiero%20saber%20m%C3%A1s%20sobre%20las%20clases!"
   target="_blank"
   rel="noopener"
   aria-label="Contactar por WhatsApp">

  <img src="whatsapp.png" alt="WhatsApp">

</a>

  <footer>
    © 2026 Can Quiroga | Canto · Piano · Teoría Musical
  </footer>

</body>
</html>
